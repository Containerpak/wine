name: Publish

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v3

      - name: Build the Docker image
        run: docker image build -f Containerfile --tag ghcr.io/containerpak/wine:main .

      - name: Push To GHCR
        run: |
          docker login ghcr.io -u ${{ env.REGISTRY_USER }} -p ${{ env.REGISTRY_PASSWORD }}
          docker image push "ghcr.io/containerpak/wine:main"
