name: Publish

on:
  push:
    branches: ["**"]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-wine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            multiarch: x86_64-linux-gnu
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            multiarch: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: identity
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME//\//-}-${{ matrix.arch }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/containerpak/wine:$tag" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/containerpak/wine
          tags: type=raw,value=${{ steps.identity.outputs.tag }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Containerfile
          pull: true
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wine-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wine-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Verify runtime
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MULTIARCH: ${{ matrix.multiarch }}
        run: |
          docker run --rm \
            --env EXPECTED_ARCH \
            --env EXPECTED_MULTIARCH \
            "$IMAGE" sh -ceu '
              test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
              test -d "/usr/lib/$EXPECTED_MULTIARCH"
              test -d "/usr/lib/$EXPECTED_MULTIARCH/gstreamer-1.0"
              if [ "$EXPECTED_ARCH" = amd64 ]; then
                test -d /usr/lib/i386-linux-gnu
                dpkg-query -W libvulkan1:i386
              else
                ! dpkg --print-foreign-architectures | grep -Fx i386
              fi
            '

      - name: Publish summary
        run: echo "${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: identity
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/containerpak/wine:$tag" >> "$GITHUB_OUTPUT"

      - name: Publish multiarch image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE" \
            --tag "ghcr.io/containerpak/wine:sha-${GITHUB_SHA::7}" \
            "ghcr.io/containerpak/wine:$TAG-amd64" \
            "ghcr.io/containerpak/wine:$TAG-arm64"

      - name: Verify multiarch image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          manifest="$(docker buildx imagetools inspect --raw "$IMAGE")"
          jq -e '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux")' <<< "$manifest"
          jq -e '.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux")' <<< "$manifest"

      - name: Publish summary
        run: docker buildx imagetools inspect "${{ steps.identity.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
